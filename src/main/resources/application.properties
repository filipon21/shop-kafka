############################################################################################################
# Server
############################################################################################################
spring.application.name=demo
server.port=8082
############################################################################################################
# Datasource
############################################################################################################
spring.datasource.url=jdbc:h2:mem:demo
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
############################################################################################################
# JPA / Flyway
############################################################################################################
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
############################################################################################################
# Kafka
############################################################################################################
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=orderGroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.bootstrap-servers=localhost:9092
app.kafka.topics.orders = orders

############################################################################################################
# Swagger
############################################################################################################
# Path to JSON file with API docs (default /v3/api-docs)
springdoc.api-docs.path=/api-docs
# Path to Swagger UI (default /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
############################################################################################################
# Logging
############################################################################################################
# Detailed Spring Security filter chain logs
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
# Requests logs (method, URI, headers) - look RequestLoggingConfig
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
